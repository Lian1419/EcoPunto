services:
  db:
    image: postgres:17-alpine
    container_name: ecopunto-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecopunto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ecopunto_dev_password
    volumes:
      - ecopunto_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecopunto"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: ecopunto-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_USER: postgres
      DB_HOST: db
      DB_NAME: ecopunto
      DB_PASSWORD: ecopunto_dev_password
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: ecopunto-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  ecopunto_data:

